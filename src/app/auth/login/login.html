<div class="login-wrapper">
  <div class="login-card">
    <h3 class="text-center mb-1"><i class="fa fa-hospital-o"></i> InfinityCoderzz CMS</h3>
    <p class="text-center text-muted mb-4">Doctor &middot; Lab &middot; Reception &middot; Pharmacy</p>

    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          class="form-control"
          formControlName="username"
          [class.is-invalid]="isSubmitted && f['username'].invalid"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          class="form-control"
          formControlName="password"
          [class.is-invalid]="isSubmitted && f['password'].invalid"
          autocomplete="current-password"
        />
      </div>

      <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-success btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-1"></span>
        Login
      </button>
    </form>
  </div>
</div>
