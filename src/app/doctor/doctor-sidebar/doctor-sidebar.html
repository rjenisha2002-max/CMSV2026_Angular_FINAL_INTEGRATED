<aside class="doctor-sidebar d-flex flex-column" [class.collapsed]="collapsed">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <i class="fa fa-heartbeat"></i>
    </div>
    <div class="brand-text" *ngIf="!collapsed">
      <span class="brand-title">InfinityCoderzz</span>
      <span class="brand-subtitle">Clinical Management System</span>
    </div>
  </div>

  <button
    type="button"
    class="collapse-toggle"
    (click)="toggleCollapse()"
    [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.title]="collapsed ? 'Expand' : 'Collapse'"
  >
    <i class="fa" [ngClass]="collapsed ? 'fa-angle-double-right' : 'fa-angle-double-left'"></i>
  </button>

  <nav class="sidebar-nav flex-grow-1">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link" routerLink="/doctor/dashboard" routerLinkActive="active">
          <i class="fa fa-th-large"></i> <span *ngIf="!collapsed">Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/doctor/appointments" routerLinkActive="active">
          <i class="fa fa-calendar-check-o"></i> <span *ngIf="!collapsed">Appointments</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/doctor/patient-search" routerLinkActive="active">
          <i class="fa fa-file-text-o"></i> <span *ngIf="!collapsed">Patient Report</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <div class="today-chip" *ngIf="!collapsed">
      <i class="fa fa-calendar-o"></i> {{ today | date: 'EEE, d MMM y' }}
    </div>

    <div class="user-chip">
      <i class="fa fa-user-circle"></i>
      <div *ngIf="!collapsed">
        <div class="user-name">{{ fullName }}</div>
        <div class="user-role">Doctor</div>
      </div>
    </div>
    <button class="btn btn-sm logout-btn" (click)="logout()" [attr.title]="'Logout'">
      <i class="fa fa-sign-out"></i> <span *ngIf="!collapsed">Logout</span>
    </button>
  </div>
</aside>
