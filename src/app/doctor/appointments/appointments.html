<div class="doctor-layout">
  <app-doctor-sidebar></app-doctor-sidebar>

  <div class="doctor-content">
<div class="page-heading">
  <h3>Appointments</h3>
  <div class="btn-group">
    <button class="btn" [class.btn-theme]="currentSelection === 'today'" [class.btn-theme-outline]="currentSelection !== 'today'" (click)="load('today')">Today</button>
    <button class="btn" [class.btn-theme]="currentSelection === 'tomorrow'" [class.btn-theme-outline]="currentSelection !== 'tomorrow'" (click)="load('tomorrow')">Tomorrow</button>
  </div>
</div>

<div class="alert alert-info" *ngIf="loading">Loading...</div>
<div class="alert alert-danger" *ngIf="error">{{ error }}</div>

<!-- Trending tile layout: one card per appointment instead of a plain table -->
<div *ngIf="!loading && !error">
  <div class="trend-card" *ngFor="let a of appointments">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <div class="d-flex align-items-center">
        <div class="token-badge">#{{ a.tokenNumber }}</div>
        <div class="ml-3">
          <div class="patient-name">{{ a.fullName }}</div>
          <div class="patient-meta">{{ a.mmrCode }} &middot; {{ a.age }} / {{ a.gender }} &middot; {{ a.mobileNumber }}</div>
        </div>
      </div>
      <div class="d-flex align-items-center">
        <div class="appt-time mr-3"><i class="fa fa-clock-o"></i> {{ a.appointmentTime }}</div>
        <span class="badge-theme mr-3" [class.status-completed]="a.status === 'Completed'" [class.status-cancelled]="a.status === 'Cancelled'">{{ a.status }}</span>
        <a class="btn btn-theme btn-sm" [routerLink]="['/doctor/consultation', a.appointmentId]" *ngIf="a.status === 'Scheduled'">Start Consultation</a>
      </div>
    </div>
  </div>

  <div class="theme-card text-center text-muted" *ngIf="appointments.length === 0">
    No appointments found.
  </div>
</div>
  </div>
</div>
