<h3>Welcome, {{ technicianName }}</h3>

<app-skeleton-cards *ngIf="loading" [count]="4"></app-skeleton-cards>
<div class="alert alert-danger" *ngIf="error">{{ error }}</div>

<div class="row mt-3" *ngIf="!loading && !error">
  <div class="col-md-3 mb-3">
    <app-stat-card label="Pending Tests" [value]="stats.pendingTests ?? 0" colorClass="bg-warning" [index]="0"></app-stat-card>
  </div>
  <div class="col-md-3 mb-3">
    <app-stat-card label="Completed Tests" [value]="stats.completedTests ?? 0" colorClass="bg-success" [index]="1"></app-stat-card>
  </div>
  <div class="col-md-3 mb-3">
    <app-stat-card label="Total Requests" [value]="stats.totalRequests ?? 0" colorClass="bg-info" [index]="2"></app-stat-card>
  </div>
  <div class="col-md-3 mb-3">
    <app-stat-card label="Unpaid Bills" [value]="stats.unpaidBills ?? 0" colorClass="bg-danger" [index]="3"></app-stat-card>
  </div>
</div>

<div class="mt-3">
  <a routerLink="/lab/pending-tests" class="btn btn-success mr-2">Pending Tests</a>
  <a routerLink="/lab/billing" class="btn btn-outline-success mr-2">Billing</a>
  <a routerLink="/lab/reports" class="btn btn-outline-success">Reports</a>
</div>

<app-lab-workload-heatmap *ngIf="!loading && !error"></app-lab-workload-heatmap>
